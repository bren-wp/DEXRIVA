name: DEXRIVE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure source has been imported
        id: check
        run: |
          if test -f dexrive-core/build.gradle.kts; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Source import has not completed yet."
          fi
      - name: Verify DEXRIVE patch and asset presence
        if: steps.check.outputs.ready == 'true'
        run: |
          test -f dexrive-gui/src/main/java/jadx/gui/ui/dialog/DexriveInspector.java
          test -f dexrive-gui/src/main/resources/logos/dexrive-logo.png
          test -f NOTICE
          test -f LICENSE
      - name: Brand and licensing smoke checks
        if: steps.check.outputs.ready == 'true'
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Gradle GUI and core tests
        if: steps.check.outputs.ready == 'true'
        run: ./gradlew --no-daemon :dexrive-gui:test :dexrive-core:test :dexrive-cli:test :dexrive-commons:dexrive-app-commons:test
