name: Android APK Inspector
on:
  push:
    branches: [main]
    paths: ['android-inspector/**', '.github/workflows/android-inspector.yml']
  pull_request:
    paths: ['android-inspector/**', '.github/workflows/android-inspector.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test and compile debug APK
        working-directory: android-inspector
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DEXRIVA-APK-Inspector-debug
          path: android-inspector/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
