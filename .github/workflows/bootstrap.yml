name: Import JADX into DEXRIVA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
      - '.dexriva/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dexriva-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import pinned upstream and patch DEXRIVA
        run: bash .dexriva/bootstrap.sh
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f gradle/wrapper/gradle-wrapper.jar
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: import JADX engine and DEXRIVA desktop foundations"
          git push origin HEAD:main
