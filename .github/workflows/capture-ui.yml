name: Capture genuine DEXRIVE UI screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build real Windows GUI
        shell: pwsh
        run: |
          python .dexrive/make_windows_ico.py
          .\gradlew.bat --no-daemon :dexrive-gui:copyDistWinWithJre -PbundleJRE=true
      - name: Capture a running DEXRIVE desktop window
        shell: pwsh
        run: |
          .\scripts\capture_windows_ui.ps1 -Launcher 'dexrive-gui/build/dexrive-gui-with-jre-win/DEXRIVE.exe' -Output 'docs/screenshots/windows-home.png'
      - uses: actions/upload-artifact@v4
        with:
          name: dexrive-shot-windows
          path: docs/screenshots/windows-home.png
          if-no-files-found: error

  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM for Android emulator
        run: |
          sudo sh -c 'echo "KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Build actual Android Inspector
        working-directory: android-inspector
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Install, run and capture real Android framebuffer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/capture_android_ui.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dexrive-shot-android
          path: docs/screenshots/android-inspector-home.png
          if-no-files-found: error
