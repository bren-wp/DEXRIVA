name: Capture genuine DEXRIVE application screenshots
on:
  push:
    branches: [feature/dexrive-real-screenshots-kvm]
    paths:
      - '.github/workflows/capture-ui.yml'
      - 'android-inspector/**'
      - 'scripts/capture_android_ui.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dexrive-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dexrive-real-screenshots-kvm
          persist-credentials: true
      - name: Retrieve verified screenshot from the actual Windows GUI run
        uses: actions/download-artifact@v4
        with:
          run-id: 41556063331
          github-token: ${{ github.token }}
          name: dexrive-shot-windows
          path: docs/screenshots
      - name: Verify real screenshot and add Windows image to README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path('docs/screenshots/windows-home.png')
          data = p.read_bytes()
          assert data.startswith(bytes.fromhex('89504e470d0a1a0a')) and len(data) > 15000
          w, h = struct.unpack('>II', data[16:24])
          assert w >= 500 and h >= 350, (w,h)
          file = Path('README.md')
          text = file.read_text()
          start = '<!-- BEGIN DEXRIVE SCREENSHOTS -->'
          end = '<!-- END DEXRIVE SCREENSHOTS -->'
          content = """<!-- BEGIN DEXRIVE SCREENSHOTS -->

          ### Windows desktop · Actual running application

          ![Real DEXRIVE GUI window captured on a Windows runner](docs/screenshots/windows-home.png)

          The image shows the live desktop workspace, not a design mockup. The Android screenshot is added only after a real emulator capture succeeds.

          <!-- END DEXRIVE SCREENSHOTS -->"""
          content = '\n'.join(line.strip() if line.startswith('          ') else line for line in content.splitlines())
          assert text.count(start) == text.count(end) == 1
          a = text.index(start)
          b = text.index(end, a) + len(end)
          file.write_text(text[:a] + content + text[b:])
          PY
      - name: Commit verified Windows screenshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/screenshots/windows-home.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: include real Windows DEXRIVE screenshot [skip ci]"
          git push origin HEAD:feature/dexrive-real-screenshots-kvm

  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Linux KVM acceleration for stable Android emulator boot
        run: |
          sudo sh -c 'echo "KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Compile Android Inspector from source
        working-directory: android-inspector
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Launch installed APK and capture actual Android display
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/capture_android_ui.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dexrive-shot-android
          path: docs/screenshots/android-inspector-home.png
          if-no-files-found: error

  android-gallery:
    needs: [android-ui, windows-gallery]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dexrive-real-screenshots-kvm
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: dexrive-shot-android
          path: docs/screenshots
      - name: Add actual Android screenshot alongside Windows capture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path('docs/screenshots/android-inspector-home.png')
          data = p.read_bytes()
          assert data[:8] == bytes.fromhex('89504e470d0a1a0a') and len(data) > 15000
          w, h = struct.unpack('>II', data[16:24])
          assert w >= 360 and h >= 640
          f = Path('README.md')
          src = f.read_text()
          start = '<!-- BEGIN DEXRIVE SCREENSHOTS -->'
          end = '<!-- END DEXRIVE SCREENSHOTS -->'
          assert src.count(start) == src.count(end) == 1
          replacement = """<!-- BEGIN DEXRIVE SCREENSHOTS -->

          ### Windows desktop · Actual running application

          ![Real DEXRIVE GUI window captured on a Windows runner](docs/screenshots/windows-home.png)

          ### Android · Actual running companion application

          ![Real DEXRIVE Inspector home screen captured on Android emulator](docs/screenshots/android-inspector-home.png)

          *Both images come from compiled, launched applications. These are not illustrations or design mockups; the Android screenshot shows the home screen without a selected APK.*

          <!-- END DEXRIVE SCREENSHOTS -->"""
          replacement = '\n'.join(line.strip() if line.startswith('          ') else line for line in replacement.splitlines())
          a = src.index(start)
          b = src.index(end, a) + len(end)
          f.write_text(src[:a] + replacement + src[b:])
          PY
      - name: Commit verified Android screenshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/screenshots/android-inspector-home.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: include real Android DEXRIVE screenshot [skip ci]"
          git push origin HEAD:feature/dexrive-real-screenshots-kvm
